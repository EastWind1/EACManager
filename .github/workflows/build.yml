name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Init database schema
        env:
          PGHOST: localhost
          PGDATABASE: test
          PGUSER: postgres
          PGPASSWORD: admin
        run: |
          cd $GITHUB_WORKSPACE/deploy/database
          psql -f ./init_schema.sql

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          settings-path: ${{ github.workspace }}
          cache: "maven"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27"

      - name: Set up vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 'lts'
          cache: true

      - name: Build with script
        env: 
          DB_NAME: test
          DB_USERNAME: postgres
          DB_PASSWORD: admin
        run: cd $GITHUB_WORKSPACE && bash ./deploy/build.sh

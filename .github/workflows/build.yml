name: Build

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: dump
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Init database schema 
      env:
        PGHOST: localhost
        PGUSER: postgres
        PGPASSWORD: admin
        PGDATABASE: dump
      run: |
        cd $GITHUB_WORKSPACE/deploy/database
        psql -f ./init_schema.sql

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        settings-path: ${{ github.workspace }}
        cache: 'maven'

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'
    
    - name: Set up Node.js
      uses: actions/setup-node@v6.2.0
      with:
        node-version: '24.21.0'

    - name: Set up pnpm and dependence
      run: cd $GITHUB_WORKSPACE/frontend && npm i -g pnpm && pnpm i
    
    - name: Build with script
      run: cd $GITHUB_WORKSPACE && chmod +x ./deploy/build.sh && sh ./deploy/build.sh
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend-java"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/backend-go"
    schedule:
      interval: "day"
  - package-ecosystem: "pnpm"
    directory: "/frontend"
    schedule:
      interval: "day"
  - package-ecosystem: "uv"
    directory: "/ocr0server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"

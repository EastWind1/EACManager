services:
  postgres:
    image: postgres:19-alpine
    container_name: eac-postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      start_period: 5s
  redis:
    image: redis:alpine
    container_name: eac-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redisdata:/data
  backend:
    image: eclipse-temurin:25-jre-alpine
    container_name: eac-backend-java
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - ./backend-java:/app/backend
    working_dir: /app/backend
    command: ["java", "-jar", "billmanager-1.0.0.jar"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      start_period: 5s
  frontend:
    image: caddy:2-alpine
    container_name: eac-frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./frontend/conf:/etc/caddy
      - ./frontend/cert:/data
      - ./frontend/html:/srv
volumes:
  pgdata:
  redisdata:

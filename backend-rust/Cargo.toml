[package]
name = "billmanager"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "billmanager"
path = "src/main.rs"

[lib]
name = "billmanager"
path = "src/lib.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.16"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
thiserror = "2"
infer = "0.19"
calamine = "0.30"
rust_xlsxwriter = "0.90"
zip = { version = "4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["multipart", "rustls-tls", "json"], default-features = false }
pdf-extract = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

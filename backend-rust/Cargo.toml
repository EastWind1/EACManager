[package]
name = "billmanager"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "billmanager"
path = "src/main.rs"

[lib]
name = "billmanager"
path = "src/lib.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
bcrypt = "0.19"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
thiserror = "2"
infer = "0.22"
calamine = "0.38"
rust_xlsxwriter = "0.102"
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", features = ["multipart", "rustls", "json"], default-features = false }
pdf-extract = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tower-http = { version = "0.7", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

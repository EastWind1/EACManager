[project]
name = "ocr-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EastWind1", email = "657857337@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "filetype>=1.2.0",
    "onnxruntime>=1.29.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ocr-server = "ocr_server:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
# filetype 无类型标注（无 py.typed/stub），相关 Unknown 集中在 guess_mime 一处，已运行时验证
reportMissingTypeStubs = "none"
# argparse.Namespace 属性与 uvicorn LOGGING_CONFIG 等动态对象为 Any，收窄代价大于收益
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult = "none"

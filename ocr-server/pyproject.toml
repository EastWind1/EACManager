[project]
name = "ocr-server"
version = "0.1.0"
description = "OCR API Server"
readme = "README.md"
authors = [
    { name = "EastWind1", email = "657857337@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "filetype>=1.2.0",
    "onnxruntime>=1.31.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.33",
    "rapidocr>=3.10.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ocr-server = "ocr_server:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

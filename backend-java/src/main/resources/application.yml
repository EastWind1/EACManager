spring:
  application:
    name: Elevator AC After-Sale Manager
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 批量写入：同表语句合并成 JDBC batch
        jdbc:
          batchSize: 30
        orderInserts: true
        orderUpdates: true
        batchVersionedData: true
  servlet:
    multipart:
      max-file-size: 5MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      repositories:
        enabled: false
  cache:
    redis:
      time-to-live: 300s
      cache-null-values: false
# 自定义配置
config:
  # 附件
  attachment:
    # 目录
    path: ${user.dir}${file.separator}attachment
  # JWT 密钥
  jwt:
    # token 有效期，单位秒
    expire: ${JWT_EXPIRE:604800}
    # 密钥必须由环境提供（至少 32 字节）
    secret: ${JWT_SECRET:}
